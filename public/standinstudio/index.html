<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Stand-In Studio: a low-poly posing studio for drawing reference, storyboarding and AI previs by D the Designer. Dial body types, pose figures with props, frame shots, animate camera moves, and export drawn-style stills and clips.">
<style>:root{color-scheme:light}body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>
<title>Stand-In Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&family=Martian+Mono:wght@400;500&display=swap">
<style>
/* Layout: storyboard drafting table — library left, paper frame center, inspector right, timeline under the frame. Non-photo blue marks selection, red pencil marks keys and recording. */
:root{
  --bg:#E8ECEF; --panel:#F5F7F8; --raise:#FFFFFF; --ink:#151B21; --muted:#5A6773; --rule:#D1D8DE;
  --blue:#2A76B5; --blue-soft:#D7EAF6; --blue-line:#9BCBE8; --red:#C2413A; --stage:#D9DFE4; --shadow:rgba(20,30,40,.12);
  --font-ui:"Schibsted Grotesk", ui-sans-serif, system-ui, sans-serif;
  --font-num:"Martian Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1317; --panel:#151A1F; --raise:#1C2329; --ink:#E3E8EC; --muted:#8D9AA5; --rule:#27303A;
  --blue:#74B9EC; --blue-soft:#1B3345; --blue-line:#3B6C90; --red:#EE6B5F; --stage:#0B0E11; --shadow:rgba(0,0,0,.4); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1317; --panel:#151A1F; --raise:#1C2329; --ink:#E3E8EC; --muted:#8D9AA5; --rule:#27303A;
  --blue:#74B9EC; --blue-soft:#1B3345; --blue-line:#3B6C90; --red:#EE6B5F; --stage:#0B0E11; --shadow:rgba(0,0,0,.4); color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-ui);font-size:13px;overflow:hidden}
*{box-sizing:border-box}
button,select,input{font:inherit;color:inherit}
.app{height:100%;display:grid;grid-template-columns:268px minmax(0,1fr) 316px;grid-template-rows:50px minmax(0,1fr) 62px;}
.top{grid-column:1/-1;display:flex;align-items:center;gap:16px;padding-inline:16px;border-bottom:1px solid var(--rule);background:var(--panel)}
.brand{display:flex;align-items:baseline;gap:6px;white-space:nowrap}
.brand b{font-size:16px;font-weight:700;letter-spacing:-.01em}
.brand span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.14em;font-weight:600}
.byline{margin-left:10px;padding-left:10px;border-left:1px solid var(--rule);font-size:11px;font-weight:700;letter-spacing:.12em;color:var(--muted);text-decoration:none}
.byline:hover,.byline:focus-visible{color:var(--blue)}
.mark{width:14px;height:14px;border:2px solid var(--ink);border-radius:50%;position:relative;top:2px;align-self:center}
.mark::after{content:"";position:absolute;inset:3px;background:var(--blue);border-radius:50%}
.seg{display:flex;border:1px solid var(--rule);border-radius:8px;overflow:hidden;background:var(--raise)}
.seg button{border:0;background:none;padding:6px 11px;cursor:pointer;color:var(--muted);font-weight:500;border-right:1px solid var(--rule)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--blue-soft);color:var(--ink)}
.top .spacer{flex:1}
.lbl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;font-weight:600}
select{background:var(--raise);border:1px solid var(--rule);border-radius:7px;padding:5px 8px}
.btn{border:1px solid var(--rule);background:var(--raise);border-radius:7px;padding:6px 10px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--blue-line)}
.btn.primary{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.btn.rec{color:var(--red);border-color:color-mix(in srgb,var(--red) 40%,var(--rule))}
.btn.small{padding:3px 8px;font-size:12px}
.btn:focus-visible,.seg button:focus-visible,.chip:focus-visible,.card:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
aside{background:var(--panel);min-height:0;display:flex;flex-direction:column}
.left{grid-row:2/4;border-right:1px solid var(--rule)}
.right{grid-row:2/4;grid-column:3;border-left:1px solid var(--rule)}
.tabs{display:flex;border-bottom:1px solid var(--rule);padding-inline:8px;gap:2px;flex-wrap:wrap}
.tabs button{border:0;background:none;padding:10px 8px 9px;cursor:pointer;color:var(--muted);font-weight:600;font-size:12px;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--blue)}
.pane{flex:1;min-height:0;overflow-y:auto;padding:12px 14px 18px;display:flex;flex-direction:column;gap:14px}
.sec{display:flex;flex-direction:column;gap:8px}
.sec h3{margin:0;font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:600;display:flex;justify-content:space-between;align-items:center}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{border:1px solid var(--rule);background:var(--raise);border-radius:99px;padding:3px 9px;font-size:12px;cursor:pointer;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--blue-soft);border-color:var(--blue-line)}
.row{display:grid;grid-template-columns:86px minmax(0,1fr) 54px;align-items:center;gap:8px}
.row label{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row output{font-family:var(--font-num);font-size:10.5px;text-align:right;font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--blue);height:18px;margin:0}
.check{display:flex;align-items:center;gap:7px;font-size:12px;cursor:pointer}
.check input{accent-color:var(--blue)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.card{border:1px solid var(--rule);background:var(--raise);border-radius:8px;padding:0;cursor:pointer;display:flex;flex-direction:column;overflow:hidden;text-align:left}
.card:hover{border-color:var(--blue-line)}
.card[aria-pressed="true"]{border-color:var(--blue);box-shadow:0 0 0 1px var(--blue)}
.card .th{aspect-ratio:132/168;background:#fff;display:block;width:100%;max-width:100%;object-fit:cover}
.card .th.ph{background:repeating-linear-gradient(135deg,#f2f4f5 0 6px,#fff 6px 12px)}
.card .nm{padding:5px 7px 6px;font-size:11.5px;line-height:1.25;font-weight:500;min-height:2.6em}
.card .tg{display:flex;gap:4px;padding:0 6px 6px;flex-wrap:wrap}
.card .tg button{font-size:10.5px;border:1px solid var(--rule);border-radius:5px;background:var(--panel);padding:1px 6px;cursor:pointer}
.search{width:100%;background:var(--raise);border:1px solid var(--rule);border-radius:7px;padding:6px 9px}
.list{display:flex;flex-direction:column;gap:4px}
.item{display:flex;align-items:center;gap:8px;border:1px solid var(--rule);background:var(--raise);border-radius:7px;padding:6px 8px;cursor:pointer}
.item[aria-pressed="true"]{border-color:var(--blue);background:var(--blue-soft)}
.item .meta{color:var(--muted);font-size:11px;margin-left:auto}
.note{font-size:12px;color:var(--muted);line-height:1.45;margin:0}
.ikrow{display:flex;align-items:center;gap:8px;font-size:12px;border:1px dashed var(--blue-line);border-radius:7px;padding:6px 8px}
.ikrow span{flex:1}
.btnrow{display:flex;flex-wrap:wrap;gap:6px}
.jgroup{display:grid;grid-template-columns:62px minmax(0,1fr);gap:6px;align-items:start}
.jgroup .lbl{padding-top:4px;font-size:10px}
textarea{width:100%;min-height:130px;background:var(--raise);border:1px solid var(--rule);border-radius:7px;padding:8px;font-family:var(--font-num);font-size:11px;line-height:1.5;resize:vertical;color:var(--ink)}
.stage{grid-column:2;grid-row:2;position:relative;background:var(--stage);display:flex;align-items:center;justify-content:center;min-width:0;min-height:0;overflow:hidden}
.frame{position:relative;box-shadow:0 1px 0 var(--rule),0 10px 30px var(--shadow);background:#fff}
.frame canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#gl{touch-action:none;cursor:grab}
#ov{pointer-events:none}
.hud{position:absolute;left:10px;top:8px;font-family:var(--font-num);font-size:10.5px;color:#2A76B5;pointer-events:none;letter-spacing:.02em;background:rgba(255,255,255,.75);padding:2px 6px;border-radius:4px}
.hud.r{left:auto;right:10px}
.hint{position:absolute;bottom:6px;left:0;right:0;text-align:center;font-size:11px;color:var(--muted);pointer-events:none}
.recbadge{position:absolute;top:10px;left:50%;transform:translateX(-50%);background:var(--red);color:#fff;font-weight:600;font-size:12px;padding:4px 10px;border-radius:99px}
.timeline{grid-column:2;grid-row:3;border-top:1px solid var(--rule);background:var(--panel);display:flex;align-items:center;gap:12px;padding-inline:14px;min-width:0}
.tc{font-family:var(--font-num);font-size:12px;font-variant-numeric:tabular-nums;min-width:96px}
.scrub{flex:1;position:relative;min-width:60px}
.keys{position:absolute;inset:0;pointer-events:none}
.key{position:absolute;top:50%;width:10px;height:10px;background:var(--red);transform:translate(-50%,-50%) rotate(45deg);border:2px solid var(--panel)}
.play{width:36px;height:36px;border-radius:50%;border:1px solid var(--rule);background:var(--raise);cursor:pointer;display:grid;place-items:center}
.play svg{width:14px;height:14px;fill:var(--ink)}
#toast{position:fixed;bottom:76px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:8px 14px;border-radius:8px;font-size:12.5px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9;max-width:calc(100% - 32px)}
#toast.on{opacity:1}
.colorrow{display:grid;grid-template-columns:86px 1fr;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
input[type=color]{width:100%;height:26px;border:1px solid var(--rule);border-radius:6px;background:var(--raise);padding:2px}
.kbd{font-family:var(--font-num);font-size:10px;border:1px solid var(--rule);border-radius:4px;padding:0 4px;background:var(--raise)}
@media (max-width: 900px){
  body{overflow:auto}
  .app{height:auto;grid-template-columns:minmax(0,1fr);grid-template-rows:auto 62vh 62px auto auto;padding-inline:0}
  .top{flex-wrap:wrap;padding-block:8px;gap:8px}
  .stage{grid-column:1;grid-row:2}
  .timeline{grid-column:1;grid-row:3}
  .right{grid-column:1;grid-row:4;border-left:0;border-top:1px solid var(--rule)}
  .left{grid-column:1;grid-row:5;border-right:0;border-top:1px solid var(--rule)}
  .pane{max-height:none;overflow:visible}
  .seg{overflow-x:auto;max-width:100%}
}
@media (prefers-reduced-motion: reduce){#toast{transition:none}}
</style>

<div class="app" id="app">
  <header class="top">
    <div class="brand"><span class="mark" aria-hidden="true"></span><b>Stand-In</b><span>Studio</span><a class="byline" href="https://d-the-designer.com/" target="_blank" rel="noopener">by D THE DESIGNER</a></div>
    <div class="seg" id="styleSeg" role="group" aria-label="Render style"></div>
    <div class="spacer"></div>
    <label class="lbl" for="aspectSel">Frame</label>
    <select id="aspectSel"></select>
    <button class="btn" id="addFigTop">Add figure</button>
    <button class="btn primary" id="quickPng">Save still</button>
  </header>

  <aside class="left">
    <div class="tabs" role="tablist" id="leftTabs"></div>
    <div class="pane" id="leftPane"></div>
  </aside>

  <main class="stage" id="stage">
    <div class="frame" id="frame">
      <canvas id="gl"></canvas>
      <canvas id="ov"></canvas>
      <div class="hud" id="hudL"></div>
      <div class="hud r" id="hudR"></div>
    </div>
    <div class="hint" id="hint">Drag a body part to pose it · <span class="kbd">Shift</span> twist · <span class="kbd">Alt</span> move figure · drag empty space to orbit, right-drag to pan, scroll to dolly</div>
  </main>

  <div class="timeline">
    <button class="play" id="playBtn" aria-label="Play clip"><svg viewBox="0 0 14 14" id="playIcon"><path d="M3 1.5v11l9-5.5z"/></svg></button>
    <div class="tc" id="tc">00:00:00:00</div>
    <div class="scrub"><input type="range" id="scrub" min="0" max="1000" value="0" aria-label="Clip time"><div class="keys" id="keys"></div></div>
    <button class="btn small" id="tlStart">Set start</button>
    <button class="btn small" id="tlEnd">Set end</button>
  </div>

  <aside class="right">
    <div class="tabs" role="tablist" id="rightTabs"></div>
    <div class="pane" id="rightPane"></div>
  </aside>
</div>
<div id="toast" role="status"></div>
<input type="file" id="fileIn" accept=".json,application/json" hidden>

<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
(function(){
'use strict';
const V3=THREE.Vector3, Q=THREE.Quaternion, D2R=Math.PI/180;
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const lerp=(a,b,t)=>a+(b-a)*t;
let UID=0; const uid=()=>++UID;
const _v1=new V3(),_v2=new V3(),_v3=new V3(),_v4=new V3(),_v5=new V3(),_v6=new V3(),_v7=new V3(),_q1=new Q(),_q2=new Q();
const DOWN=new V3(0,-1,0);

/* ---------------- renderer ---------------- */
const canvas=document.getElementById('gl'), ov=document.getElementById('ov'), octx=ov.getContext('2d');
const renderer=new THREE.WebGLRenderer({canvas,antialias:false,alpha:true,preserveDrawingBuffer:true});
renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFShadowMap;
renderer.autoClear=false;

function makeGrad(steps){
  const data=steps===3?new Uint8Array([95,175,255]):new Uint8Array([105,255]);
  const t=new THREE.DataTexture(data,data.length,1,THREE.RedFormat);
  t.minFilter=t.magFilter=THREE.NearestFilter; t.generateMipmaps=false; t.needsUpdate=true; return t;
}
let GRAD=makeGrad(2);
const MAT={
  body:new THREE.MeshToonMaterial({color:0xd6d6d2,gradientMap:GRAD}),
  prop:new THREE.MeshToonMaterial({color:0xc8ccd0,gradientMap:GRAD}),
  wpn:new THREE.MeshToonMaterial({color:0x8f979e,gradientMap:GRAD}),
  furn:new THREE.MeshToonMaterial({color:0xd9d3c8,gradientMap:GRAD}),
  pet:new THREE.MeshToonMaterial({color:0xcdc4b8,gradientMap:GRAD}),
  normal:new THREE.MeshNormalMaterial(),
  floor:new THREE.ShadowMaterial({color:0x000000,opacity:0.2})
};
function setToneSteps(n){ GRAD=makeGrad(n); ['body','prop','wpn','furn','pet'].forEach(k=>{MAT[k].gradientMap=GRAD;MAT[k].needsUpdate=true;});
  if(typeof S!=='undefined') S.figures.forEach(f=>{f.mat.gradientMap=GRAD;f.mat.needsUpdate=true;}); }
MAT.prop.userData.flatColor='#eceff1'; MAT.wpn.userData.flatColor='#cdd3d8'; MAT.furn.userData.flatColor='#f1ece4'; MAT.pet.userData.flatColor='#efe7dc';
const FIG_TINTS=['#cfe2f4','#f6d5cc','#d4ecd6','#ece0c2','#e1d6f1','#f2d2e3','#d0eaea','#e6e6cf'];
const FLAT=new Map();
function flatOf(m){let f=FLAT.get(m);if(!f){f=new THREE.MeshBasicMaterial({color:m.userData.flatColor||m.color});FLAT.set(m,f);}return f;}
function swapFlat(scn,on){scn.traverse(o=>{if(!o.isMesh)return;if(on){if(o.material&&o.material.isMeshToonMaterial){o.userData._m=o.material;o.material=flatOf(o.material);}}else if(o.userData._m){o.material=o.userData._m;o.userData._m=null;}});}

const CAP=new THREE.CapsuleGeometry(0.5,1,3,10), SPH=new THREE.SphereGeometry(0.5,12,9), BOX=new THREE.BoxGeometry(1,1,1);
const GEO_CACHE={};
function cylGeo(rt,rb,h,seg){const k=[rt,rb,h,seg].join('|');return GEO_CACHE[k]||(GEO_CACHE[k]=new THREE.CylinderGeometry(rt,rb,h,seg));}

/* scene */
const scene=new THREE.Scene();
const figRoot=new THREE.Group(), propRoot=new THREE.Group(); scene.add(figRoot,propRoot);
const amb=new THREE.AmbientLight(0xffffff,0.36); scene.add(amb);
const sun=new THREE.DirectionalLight(0xffffff,0.86); sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048); sun.shadow.bias=-0.0006; sun.shadow.normalBias=0.025;
scene.add(sun,sun.target);
const floor=new THREE.Mesh(new THREE.PlaneGeometry(60,60),MAT.floor); floor.rotation.x=-Math.PI/2; floor.receiveShadow=true; floor.layers.set(1); scene.add(floor);

const pcam=new THREE.PerspectiveCamera(40,16/9,0.05,200);
const ocam=new THREE.OrthographicCamera(-1,1,1,-1,0.05,200);
const activeCam=()=>S.ortho?ocam:pcam;

/* composite */
const COMP=new THREE.ShaderMaterial({
  uniforms:{tColor:{value:null},tNormal:{value:null},tDepth:{value:null},res:{value:new THREE.Vector2(1,1)},thick:{value:1.5},mode:{value:0},
    nearZ:{value:.05},farZ:{value:200},ortho:{value:0},paper:{value:new THREE.Color(1,1,1)},ink:{value:new THREE.Color(.08,.09,.1)},gridCol:{value:new THREE.Color(.45,.72,.9)},
    bgAlpha:{value:1},dNear:{value:1},dFar:{value:10},showGrid:{value:0},invProj:{value:new THREE.Matrix4()},camWorld:{value:new THREE.Matrix4()},viewM:{value:new THREE.Matrix4()},
    nSens:{value:.5},dSens:{value:.12},lineOn:{value:1},dotScale:{value:7},useColor:{value:1}},
  vertexShader:`varying vec2 vUv;void main(){vUv=uv;gl_Position=vec4(position.xy,0.,1.);}`,
  fragmentShader:`
varying vec2 vUv;
uniform sampler2D tColor;uniform sampler2D tNormal;uniform sampler2D tDepth;
uniform vec2 res;uniform float thick;uniform float mode;uniform float nearZ;uniform float farZ;uniform float ortho;
uniform vec3 paper;uniform vec3 ink;uniform vec3 gridCol;uniform float bgAlpha;uniform float dNear;uniform float dFar;
uniform float showGrid;uniform mat4 invProj;uniform mat4 camWorld;uniform mat4 viewM;uniform float nSens;uniform float dSens;
uniform float lineOn;uniform float dotScale;uniform float useColor;
float linZ(float d){return ortho>.5?nearZ+d*(farZ-nearZ):(nearZ*farZ)/(farZ-d*(farZ-nearZ));}
void main(){
  vec2 uv=vUv;vec2 px=vec2(thick)/res;
  vec4 n0=texture2D(tNormal,uv);
  vec2 oA=vec2(px.x,px.y),oC=vec2(px.x,-px.y);
  vec4 nA=texture2D(tNormal,uv+oA),nB=texture2D(tNormal,uv-oA),nC=texture2D(tNormal,uv+oC),nD=texture2D(tNormal,uv-oC);
  float zA=linZ(texture2D(tDepth,uv+oA).x),zB=linZ(texture2D(tDepth,uv-oA).x),zC=linZ(texture2D(tDepth,uv+oC).x),zD=linZ(texture2D(tDepth,uv-oC).x);
  float both=step(.5,nA.a)*step(.5,nB.a)*step(.5,nC.a)*step(.5,nD.a);
  float cE=max(abs(nA.a-nB.a),abs(nC.a-nD.a));
  float nE=length(nA.rgb-nB.rgb)+length(nC.rgb-nD.rgb);
  float zm=max(min(min(zA,zB),min(zC,zD)),1e-4);
  float dE=(abs(zA-zB)+abs(zC-zD))/zm;
  float e=cE;
  e=max(e,both*smoothstep(nSens,nSens+.3,nE));
  e=max(e,both*smoothstep(dSens,dSens*1.8,dE));
  e=clamp(e,0.,1.)*lineOn;
  float cov=n0.a;
  vec4 cc=texture2D(tColor,uv)*useColor;
  vec3 bg=mode>3.5?vec3(0.):paper;
  vec3 P=bg*bgAlpha;float A=bgAlpha;
  if(mode<.5){P=cc.rgb+P*(1.-cc.a);A=cc.a+A*(1.-cc.a);}
  else if(mode<1.5){
    float lum=dot(cc.rgb/max(cc.a,1e-3),vec3(.299,.587,.114));
    float sh=cov>.5?smoothstep(.88,.64,lum):clamp(cc.a*2.4,0.,1.);
    vec2 p=gl_FragCoord.xy/dotScale;p=mat2(.7071,-.7071,.7071,.7071)*p;vec2 f=fract(p)-.5;float rad=sqrt(sh)*.62;
    float dt=(1.-smoothstep(rad-.09,rad+.09,length(f)))*step(.03,sh);
    P=paper*cov+P*(1.-cov);A=cov+A*(1.-cov);
    P=ink*dt+P*(1.-dt);A=dt+A*(1.-dt);
  }
  else if(mode<2.5){P=paper*cov+P*(1.-cov);A=cov+A*(1.-cov);}
  else if(mode<3.5){P=ink*cov+P*(1.-cov);A=cov+A*(1.-cov);e=0.;}
  else if(mode<4.5){float z=linZ(n0.a>.5?texture2D(tDepth,uv).x:1.);float g=1.-clamp((z-dNear)/max(dFar-dNear,1e-3),0.,1.);g=.08+.92*g;P=vec3(g)*cov+P*(1.-cov);A=cov+A*(1.-cov);e=0.;}
  else{e=0.;}
  vec2 ndc=uv*2.-1.;
  vec4 a=invProj*vec4(ndc,-1.,1.);a/=a.w;vec4 b=invProj*vec4(ndc,1.,1.);b/=b.w;
  vec3 o=(camWorld*vec4(a.xyz,1.)).xyz;vec3 dir=normalize((camWorld*vec4(b.xyz,1.)).xyz-o);
  float hitOk=step(dir.y,-1e-4);
  float t=hitOk>.5?-o.y/dir.y:0.;

function quad(g,o){
  const m=o.mat||MAT.pet,bh=o.back,d=o.d,L=o.len,w=o.w,by=bh-d/2;
  const b=mk(CAP,m);b.scale.set(w,L/2,d);b.rotation.x=Math.PI/2;b.position.set(0,by,0);g.add(b);
  const ll=by-d*0.15;
  for(const x of[-1,1])for(const z of[-1,1])cy(g,o.leg,o.leg*0.8,ll,x*w*0.3,ll/2,z*L*0.32,0,0,0,m,6);
  const a=o.neckA,N0=new V3(0,by+d*0.25,L*0.38),dir=new V3(0,Math.cos(a*D2R),Math.sin(a*D2R)),nl=o.neck;
  const nc=N0.clone().addScaledVector(dir,nl/2);const nr=o.neckR||w*0.22;cy(g,nr*0.8,nr,nl,nc.x,nc.y,nc.z,a,0,0,m,8);
  const N1=N0.clone().addScaledVector(dir,nl),hd=o.head,ht=o.headTilt,hdir=new V3(0,Math.cos(ht*D2R),Math.sin(ht*D2R));
  const hc=N1.clone().addScaledVector(hdir,hd[2]*0.38);const hm=mk(CAP,m);hm.scale.set(hd[0],hd[2]/2,hd[1]);hm.rotation.x=ht*D2R;hm.position.copy(hc);g.add(hm);
  const top=hc.y+hd[1]*0.45;
  if(o.ears)for(const s of[-1,1])cone(g,hd[0]*0.22,hd[1]*0.45,s*hd[0]*0.32,top,N1.z,0,m,4);
  if(o.longEars)for(const s of[-1,1]){const e=mk(CAP,m);e.scale.set(.035,.1,.02);e.position.set(s*.035,top+.08,N1.z-.01);e.rotation.z=s*-0.15;g.add(e);}
  if(o.horns)for(const s of[-1,1]){const c=mk(new THREE.ConeGeometry(hd[0]*0.13,hd[1]*0.9,6),MAT.furn);c.position.set(s*hd[0]*0.42,top+hd[1]*0.25,N1.z);c.rotation.set(-0.3,0,-s*0.7);g.add(c);}
  if(o.antlers)for(const s of[-1,1]){cy(g,.012,.012,.38,s*.12,top+.16,N1.z-.04,-15,0,-s*28,MAT.furn,4);cy(g,.01,.01,.18,s*.18,top+.22,N1.z+.06,40,0,-s*20,MAT.furn,4);cy(g,.01,.01,.16,s*.22,top+.34,N1.z-.02,-10,0,-s*55,MAT.furn,4);}
  if(o.tail){const ta=o.tailA,T0=new V3(0,by+d*0.15,-L*0.45),td=new V3(0,Math.cos(ta*D2R),-Math.sin(ta*D2R)),tc=T0.clone().addScaledVector(td,o.tail/2);cy(g,o.tailR||0.02,(o.tailR||0.02)*1.6,o.tail,tc.x,tc.y,tc.z,-ta,0,0,m,6);}
  (o.humps||[]).forEach(hp=>sp(g,hp[2],0,bh+hp[1],hp[0],m,1.1,0.9,1));
  if(o.skirt) bx(g,w*1.02,d*0.45,L*0.85,0,by-d*0.42,0,0,0,0,m);
  if(o.wings)for(const s of[-1,1]){bx(g,2.3,.04,1.1,s*1.45,bh+0.45,0.1,0,s*8,s*24,MAT.prop);cy(g,.05,.04,2.4,s*1.45,bh+0.5,.62,0,0,90+24*s,m,6);}
  if(o.spikes)for(let i=0;i<6;i++)cone(g,.07,.22,0,bh+0.06,-L*0.4+i*L*0.14,0,MAT.furn,4);
}

const EASE={linear:u=>u,inout:u=>u*u*(3-2*u),in:u=>u*u,out:u=>1-(1-u)*(1-u)};

function cp(b){return {pos:b.pos.slice(),tgt:b.tgt.slice(),focal:b.focal,roll:b.roll};}

const MOTIONS={none:'None',walk:'Walk forward',run:'Run forward',walkInPlace:'Walk in place',turn:'Turn around',idle:'Idle breathing'};
function applyMotion(f,kind,t,a){

  const ikL=!!f.ik.L,ikR=!!f.ik.R;

function bodyWords(f){
  const b=f.body,cmv=Math.round(f.height()*100); const w=[];
  if(isKid(b)){const sc=b.scale||1;return (sc<0.42?'infant':sc<0.6?'toddler':sc<0.8?'child':'teenager')+` (${cmv} cm)`;}
  w.push(cmv<160?'short':cmv>186?'tall':'average-height');
  w.push(b.build<0.25?'slender':b.build>0.75?'heavyset':b.build>0.55?'sturdy':'medium build');
  if(b.muscle>0.75) w.push('very muscular'); else if(b.muscle>0.5) w.push('athletic');
  if(b.bust>0.6&&b.hips>0.7) w.push('curvy');
  return w.join(', ')+` (${cmv} cm)`;
}
function shotNotes(){
  const i=shotInfo(); const c=S.camCur||rigToCam(S.rig);
  const lines=[];
  lines.push(`SHOT: ${i.shot}, ${i.angle.toLowerCase()}, ${Math.round(c.focal)}mm lens${S.ortho?' (flat projection)':''}, ${S.aspect} frame.`);
  if(clip.move!=='static'||clip.start){
    const mv=MOVES[clip.move][0]; const amt=clip.amt<0.34?'subtle':clip.amt<0.67?'moderate':'strong';
    lines.push(`MOVE: ${clip.move==='static'?'Locked-off camera':mv+' ('+amt+')'}, ${clip.dur.toFixed(1)}s, ${({inout:'ease in and out',in:'ease in',out:'ease out',linear:'constant speed'})[clip.ease]}${clip.shake>0.05?', handheld shake':''}${clip.follow?', following the subject':''}.`);
  }
  S.figures.forEach((f,k)=>{
    const props=f.poseProps.map(p=>p.def.name.toLowerCase()).concat(S.props.filter(p=>p.attach&&p.attach.fig===f).map(p=>p.def.name.toLowerCase()));
    const mo=clip.motions[f.id]&&clip.motions[f.id]!=='none'?`, ${MOTIONS[clip.motions[f.id]].toLowerCase()}`:'';
    lines.push(`FIGURE ${k+1}: ${bodyWords(f)}. Pose: ${f.poseName}${props.length?', with '+props.join(', '):''}${mo}.`);
  });
  const free=S.props.filter(p=>!p.attach).map(p=>p.def.name.toLowerCase()); if(free.length) lines.push(`SET: ${free.join(', ')}.`);
  const subj=S.figures.length===1?'one figure':S.figures.length===2?'two figures':S.figures.length+' figures';
  const lead=S.figures[0]?S.figures[0].poseName.toLowerCase():'';
  lines.push('');
  lines.push(`PROMPT: ${i.shot.toLowerCase()} of ${subj}${lead?', '+lead:''}, ${i.angle.toLowerCase()}, ${Math.round(c.focal)}mm${clip.move!=='static'?', '+MOVES[clip.move][0].toLowerCase():''}.`);
  return lines.join('\n');
}

const tScene=new THREE.Scene(); tScene.add(new THREE.AmbientLight(0xffffff,0.36)); const tSun=new THREE.DirectionalLight(0xffffff,0.86); tSun.position.set(3,6,5); tScene.add(tSun);

const thumbQ=[];

function frameThumb(objs){
  const box=new THREE.Box3(); objs.forEach(o=>box.expandByObject(o)); const c=box.getCenter(new V3()), s=box.getSize(new V3());
  const fv=tCam.fov*D2R; const dist=Math.max(s.y/(2*Math.tan(fv/2)),Math.max(s.x,s.z)/(2*Math.tan(fv/2)*tCam.aspect))*1.18+Math.max(s.x,s.z)*0.5;
  const dir=new V3(Math.sin(28*D2R),0.22,Math.cos(28*D2R)).normalize(); tCam.position.copy(c).addScaledVector(dir,dist); tCam.lookAt(c); tCam.updateMatrixWorld();
}
function pumpThumb(){
  const job=thumbQ.shift(); if(!job) return;
  try{
    let key; const saveStyle=S.look;
    if(job.kind==='pose'){
      const p=job.item; key='pose:'+p.id; const mem=p.members||[{use:null}];
      while(tPool.length<mem.length){const tf=new Figure(tScene,BODY_PRESETS.Average);tf.setColor(FIG_TINTS[tPool.length%FIG_TINTS.length]);tPool.push(tf);}
      tPool.forEach(f=>f.base.visible=false);
      mem.forEach((m,i)=>{const f=tPool[i];f.base.visible=true;applyMemberBody(f,m);f.base.position.set(m.x||0,0,m.z||0);f.base.rotation.y=(m.yaw||0)*D2R;f.lifter.position.y=0;const o=p.members?resolvePose(m):resolvePose(p);if(p.members)o._member=1;f.applyPose(o);if(m.mirror)f.mirror();f.update();f.update();});
      frameThumb(tPool.filter(f=>f.base.visible).map(f=>f.base));
    } else {
      key='prop:'+job.item.id; tPool.forEach(f=>f.base.visible=false); tProps.clear(); const g=buildProp(job.item); tProps.add(g); frameThumb([g]);
    }
    const T=renderPass(tScene,tCam,132,168,'thumb','clean',{transparent:false,grid:false,thick:1.1});
    const cv=targetToCanvas(T); THUMBS[key]=cv.toDataURL('image/png'); tProps.clear();
    document.querySelectorAll(`[data-thumb="${CSS.escape(key)}"]`).forEach(el=>{const img=h('img',{class:'th',src:THUMBS[key],alt:'','data-thumb':key});el.replaceWith(img);});
  }catch(e){ console.warn('thumb',e); }
  setTimeout(pumpThumb,12);
}

function tick(now){

  const dt=Math.min(0.1,(now-last)/1000); last=now;
  if(S.exporting) return;
  if(S.playing){ S.time+=dt; if(S.time>clip.dur){ if(clip.loop) S.time=S.time%clip.dur; else {S.time=clip.dur;setPlaying(false);} } evalClip(S.time); updateTimeline(); }
  else if(!S.camOverride) applyCam(rigToCam(S.rig));
  S.figures.forEach(f=>f.update());
  updateLight();
  renderPass(scene,activeCam(),Math.round(VW*PR),Math.round(VH*PR),'view',S.style,{toScreen:true,grid:S.look.grid});
  drawOverlay(); updateHud();
}

/* ---------------- boot ---------------- */
document.getElementById('playBtn').addEventListener('click',()=>setPlaying(!S.playing));
document.getElementById('scrub').addEventListener('input',e=>{setPlaying(false);ensureStart();S.time=(+e.target.value/1000)*clip.dur;evalClip(S.time);updateTimeline();});
document.getElementById('tlStart').addEventListener('click',setStartKey);
document.getElementById('tlEnd').addEventListener('click',setEndKey);

addFigure(BODY_PRESETS.Athletic,'Athletic'); addFigure(BODY_PRESETS.Curvy,'Curvy');
applyPoseEntry(POSES.find(p=>p.id==='c-b2b'));
S.selFig=S.figures[0]; S.lastPose='c-b2b'; S.poseCat='Couples';
S.rig.target.set(0,1.05,0); S.rig.yaw=0.62; S.rig.pitch=-0.14; S.rig.focal=35;
resize(); applyCam(rigToCam(S.rig));
S.figures.forEach(f=>{f.update();f.update();});
setShot('FS'); S.rig.dist*=1.25; S.rig.pitch=-0.12;
renderStyleSeg(); renderLeftTabs(); renderLeft(); renderRight(); updateTimeline();
POSES.forEach(p=>queueThumb({kind:'pose',item:p})); PROP_DEFS.forEach(d=>queueThumb({kind:'prop',item:d})); MY_POSES.forEach(p=>queueThumb({kind:'pose',item:p}));
requestAnimationFrame(tick); setTimeout(pumpThumb,300);
})();
</script>
